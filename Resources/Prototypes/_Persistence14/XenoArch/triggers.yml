# Food trigger - matches any edible item that is either tagged Cooked, is a microwave recipe result,
# or is never itself used as an ingredient in another recipe (finished dishes with no further use,
# e.g. a whole pizza or a baked bun). Raw ingredients that aren't used in any current recipe need the
# IgnoredByArtifactTrigger tag to be excluded.
- type: xenoArchTrigger
  id: TriggerFood
  tip: xenoarch-trigger-tip-food
  components:
  - type: XATItemInteract
    use: 1
    useTime: 1s
    requireRecipeResult: true
    whitelist:
      components:
      - Edible

# Drink trigger - matches any reagent tagged Alcohol (see BaseAlcohol) that is also a reaction product mixed
# from another Alcohol-tagged reagent, excluding straight liquors
- type: xenoArchTrigger
  id: TriggerDrink
  tip: xenoarch-trigger-tip-drink
  components:
  - type: XATReactive
    whitelist:
      tags:
      - Alcohol
      productOfTaggedReactant:
      - Alcohol

