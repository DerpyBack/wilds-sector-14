- type: insightTrait
  id: AnomalySense
  name: insight-rationalist-anomaly-sense-name
  content: insight-rationalist-anomaly-sense-desc
  next: ArtifactReroll
  trait: AnomalySense

- type: trait
  id: AnomalySense
  name: insight-rationalist-anomaly-sense-name
  description: insight-rationalist-anomaly-sense-desc
  selectable: false
  components:
    - type: ActionGrant
      actions:
        - ActionAnomalySense
      autoDelete: true

- type: entity
  parent: BaseAction
  id: ActionAnomalySense
  name: Sense Anomaly
  description: Sense the location of the nearest anomaly.
  components:
  - type: Action
    useDelay: 30
  - type: Sprite
    sprite: Clothing/Neck/Misc/pins.rsi
    layers:
    - state: flower
  - type: InstantAction
    event: !type:SenseAnomalyEvent

- type: insightTrait
  id: ArtifactReroll
  name: insight-rationalist-reroll-node-name
  content: insight-rationalist-reroll-node-desc
  trait: ArtifactReroll
  next: Rationalist3

- type: trait
  id: ArtifactReroll
  name: insight-rationalist-reroll-node-name
  description: insight-rationalist-reroll-node-desc
  selectable: false
  components:
    - type: ActionGrant
      actions:
        - ActionArtifactReroll
      autoDelete: true

- type: entity
  parent: BaseAction
  id: ActionArtifactReroll
  name: Beggar's choice
  description: Reroll a node on an artifact (WIP).
  components:
  - type: Action
    useDelay: 30
  - type: Sprite
    sprite: Clothing/Neck/Misc/pins.rsi
    layers:
    - state: flower
  - type: InstantAction
    event: !type:ArtifactRerollEvent

- type: insightTrait
  id: Rationalist3
  name: Anomaly Generator
  content: Once per day you can generate an anomaly of your choosing.
  next: Rationalist4
  trait: AnomalySense

- type: insightTrait
  id: Rationalist4
  name: Upgrade Overclocker
  content: Once per day you can apply one upgrade past the limit on an item or machine.
  trait: AnomalySense
